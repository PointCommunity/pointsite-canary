name: Publish accepted public candidate
run-name: Publish accepted public candidate ${{ github.event.client_payload.jobId }}
on:
  repository_dispatch:
    types: [publish-candidate]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && ((github.repository == 'PointCommunity/pointsite' && github.event.client_payload.builderOrigin == 'https://builder.eaglepass.io') || (github.repository == 'PointCommunity/pointsite-canary' && github.event.client_payload.builderOrigin == 'https://builder-canary.eaglepass.io'))
    uses: PointCommunity/pointsite-staging/.github/workflows/publish-production-runtime.yml@3b5a7294ce24315b2edb7c02b91b13d3ba733bf0
    with:
      builder_origin: ${{ github.event.client_payload.builderOrigin }}
      job_id: ${{ github.event.client_payload.jobId }}
      nonce: ${{ github.event.client_payload.nonce }}
